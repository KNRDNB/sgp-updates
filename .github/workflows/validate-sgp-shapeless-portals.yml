name: Validate SGP Shapeless Nether Portals

on:
  push:
    branches: [main]
    paths:
      - "release-staging/1.9.1-test.2/portalmod/**"
      - ".github/workflows/validate-sgp-shapeless-portals.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build portal mod
        run: gradle -p release-staging/1.9.1-test.2/portalmod build --no-daemon --stacktrace
      - name: Verify exact Minecraft target descriptors
        shell: bash
        run: |
          set -euo pipefail
          CP="$(gradle -q -p release-staging/1.9.1-test.2/portalmod printRuntimeClasspath --no-daemon | tail -n 1)"
          javap -classpath "$CP" -p -s net.minecraft.world.level.portal.PortalShape > portalshape.txt
          grep -Fq 'public net.minecraft.world.level.portal.PortalShape(net.minecraft.world.level.LevelAccessor, net.minecraft.core.BlockPos, net.minecraft.core.Direction$Axis);' portalshape.txt
          grep -A2 -F 'public boolean isValid();' portalshape.txt | grep -Fq 'descriptor: ()Z'
          grep -A2 -F 'public boolean isComplete();' portalshape.txt | grep -Fq 'descriptor: ()Z'
          grep -A2 -F 'public void createPortalBlocks();' portalshape.txt | grep -Fq 'descriptor: ()V'
          grep -A2 -F 'private static boolean isEmpty(net.minecraft.world.level.block.state.BlockState);' portalshape.txt | grep -Fq 'descriptor: (Lnet/minecraft/world/level/block/state/BlockState;)Z'
          grep -Fq 'private final net.minecraft.world.level.LevelAccessor level;' portalshape.txt
          grep -Fq 'private final net.minecraft.core.Direction$Axis axis;' portalshape.txt
          grep -Fq 'private final net.minecraft.core.Direction rightDir;' portalshape.txt
          grep -Fq 'private static final net.minecraft.world.level.block.state.BlockBehaviour$StatePredicate FRAME;' portalshape.txt
          javap -classpath "$CP" -p -s net.minecraft.world.level.block.BaseFireBlock > basefire-descriptors.txt
          grep -A2 -F 'private static boolean isPortal(net.minecraft.world.level.Level, net.minecraft.core.BlockPos, net.minecraft.core.Direction);' basefire-descriptors.txt | grep -Fq 'descriptor: (Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;Lnet/minecraft/core/Direction;)Z'
          javap -classpath "$CP" -p -s net.minecraft.world.level.block.NetherPortalBlock > netherportal-descriptors.txt
          grep -A2 -F 'protected void randomTick(net.minecraft.world.level.block.state.BlockState, net.minecraft.server.level.ServerLevel, net.minecraft.core.BlockPos, net.minecraft.util.RandomSource);' netherportal-descriptors.txt | grep -Fq 'descriptor: (Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/server/level/ServerLevel;Lnet/minecraft/core/BlockPos;Lnet/minecraft/util/RandomSource;)V'
      - name: Inspect exact ignition and portal-spawn methods
        shell: bash
        run: |
          set -euo pipefail
          CP="$(gradle -q -p release-staging/1.9.1-test.2/portalmod printRuntimeClasspath --no-daemon | tail -n 1)"
          javap -classpath "$CP" -p -c -s net.minecraft.world.level.block.BaseFireBlock > basefire.txt
          javap -classpath "$CP" -p -c -s net.minecraft.world.level.block.NetherPortalBlock > netherportalblock.txt
          javap -classpath "$CP" -p -c -s 'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase' > blockstatebase.txt
          javap -classpath "$CP" -p -c -s net.minecraft.world.level.block.state.BlockState > blockstate.txt
      - name: Upload exact javap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-class-javap-1.21.1
          path: |
            portalshape.txt
            basefire.txt
            netherportalblock.txt
            blockstatebase.txt
            blockstate.txt
          retention-days: 7
      - name: Verify final JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='release-staging/1.9.1-test.2/portalmod/build/libs/SGP-Shapeless-Nether-Portals-1.1.1.jar'
          test -f "$JAR"
          unzip -t "$JAR" >/dev/null
          unzip -l "$JAR" > jarfiles.txt
          grep -Fq 'sgp/shapelessportals/mixin/PortalShapeMixin.class' jarfiles.txt
          grep -Fq 'sgp/shapelessportals/mixin/PortalShapeAccessor.class' jarfiles.txt
          grep -Fq 'sgp/shapelessportals/mixin/BaseFireBlockMixin.class' jarfiles.txt
          grep -Fq 'sgp/shapelessportals/mixin/NetherPortalBlockMixin.class' jarfiles.txt
          grep -Fq 'META-INF/NOTICE-NICER-PORTALS.txt' jarfiles.txt
          grep -Fq 'sgp_shapeless_nether_portals.mixins.json' jarfiles.txt
          javap -classpath "$JAR" -p -v sgp.shapelessportals.mixin.PortalShapeMixin > mixin.txt
          grep -Fq 'major version: 65' mixin.txt
          grep -Fq 'PortalShape' mixin.txt
          grep -Fq 'CRYING_OBSIDIAN' mixin.txt
          javap -classpath "$JAR" -p -v sgp.shapelessportals.mixin.BaseFireBlockMixin > basefire-mixin.txt
          grep -Fq 'BaseFireBlock' basefire-mixin.txt
          grep -Fq 'isPortalFrame' basefire-mixin.txt
          grep -Fq 'CRYING_OBSIDIAN' basefire-mixin.txt
          javap -classpath "$JAR" -p -v sgp.shapelessportals.mixin.NetherPortalBlockMixin > netherportal-mixin.txt
          grep -Fq 'NetherPortalBlock' netherportal-mixin.txt
          grep -Fq 'randomTick' netherportal-mixin.txt
          grep -Fq 'ZOMBIFIED_PIGLIN' netherportal-mixin.txt
          grep -Fq 'EntityType.spawn' netherportal-mixin.txt
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -Fq 'version="1.1.1"'
          unzip -p "$JAR" sgp_shapeless_nether_portals.mixins.json | grep -Fq 'BaseFireBlockMixin'
          unzip -p "$JAR" sgp_shapeless_nether_portals.mixins.json | grep -Fq 'NetherPortalBlockMixin'
          echo PORTALMOD_111_STATIC_VALIDATION_PASS
