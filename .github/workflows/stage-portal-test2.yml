name: Stage portal TEST2 and restore TEST1 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage-portal-test2.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable TEST2 source and restore TEST1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf release-staging/1.9.1-test.2/portalmod
          mkdir -p release-staging/1.9.1-test.2
          cp -a release-staging/1.9.1-test.1/portalmod release-staging/1.9.1-test.2/portalmod
          sed -i 's/mod_version=1.1.0/mod_version=1.1.1/' release-staging/1.9.1-test.2/portalmod/gradle.properties
          sed -i 's/version="1.1.0"/version="1.1.1"/' release-staging/1.9.1-test.2/portalmod/src/main/resources/META-INF/neoforge.mods.toml
          grep -Fq 'mod_version=1.1.1' release-staging/1.9.1-test.2/portalmod/gradle.properties
          grep -Fq 'version="1.1.1"' release-staging/1.9.1-test.2/portalmod/src/main/resources/META-INF/neoforge.mods.toml
          grep -Fq 'EntityType.ZOMBIFIED_PIGLIN' release-staging/1.9.1-test.2/portalmod/src/main/java/sgp/shapelessportals/mixin/NetherPortalBlockMixin.java
          grep -Fq '@Redirect' release-staging/1.9.1-test.2/portalmod/src/main/java/sgp/shapelessportals/mixin/NetherPortalBlockMixin.java
          git checkout 0ae784e78ffaec90a1d981115457c32d45ef1d3d -- release-staging/1.9.1-test.1
          git add -A release-staging/1.9.1-test.1 release-staging/1.9.1-test.2
          git commit -m 'Stage immutable portal TEST2 and restore TEST1 source'
          git push
