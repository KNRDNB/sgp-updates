name: Probe Spawn Guard Claim Hooks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-spawn-guard-claim-hooks.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact claim hooks
        run: bash release-staging/2.0.4-test.2/probe_claim_hooks.sh
