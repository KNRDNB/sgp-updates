name: Publish SGP Client 1.7.0-test.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.3.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Reconstruct exact reviewed test.3 source bundle
        shell: bash
        run: |
          set -euo pipefail
          SRC=release-staging/1.7.0-test.3
          cat "$SRC"/final-source.part0.b64 "$SRC"/final-source.part1.b64 "$SRC"/final-source.part20.b64 "$SRC"/final-source.part21.b64 "$SRC"/final-source.part22.b64 "$SRC"/final-source.part23.b64 "$SRC"/final-source.part3.b64 "$SRC"/final-source.part4.b64 > /tmp/source-bundle-test3-final.b64
          base64 -d /tmp/source-bundle-test3-final.b64 > /tmp/source-bundle-test3-final.zip
          echo "798adb53b56657188c42ee2bda25997ba821262b1ea09d2abc7379f2a93bfaee  /tmp/source-bundle-test3-final.zip" | sha256sum -c -
          test "$(stat -c %s /tmp/source-bundle-test3-final.zip)" = "24008"
          unzip -t /tmp/source-bundle-test3-final.zip >/dev/null
          rm -rf "$SRC/final-src"
          mkdir -p "$SRC/final-src"
          unzip -q /tmp/source-bundle-test3-final.zip -d "$SRC/final-src"
          test -f "$SRC/final-src/BrandingPatchV122.java"
          test -f "$SRC/final-src/AsmVerify.java"
          test -f "$SRC/final-src/wands_ru_ru_3.0.5.json"
          test -f "$SRC/final-src/sgp_logo_72x28.b64"
          test -f "$SRC/final-src/build-publish-test3.sh"
          chmod +x "$SRC/final-src/build-publish-test3.sh"

      - name: Build, audit, publish and live-verify exact test.3
        shell: bash
        run: bash release-staging/1.7.0-test.3/final-src/build-publish-test3.sh

      - name: Upload exact audited candidate as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ClientPatch_1.7.0-test.3_AUDITED
          path: out/SGP_ClientPatch_1.7.0-test.3.zip
          retention-days: 7
          if-no-files-found: error
# exact-split-rerun
