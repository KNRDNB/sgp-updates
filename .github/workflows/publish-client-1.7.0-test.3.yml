name: Publish SGP Client 1.7.0-test.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.3.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.7.0-test.3
      ASSET: SGP_ClientPatch_1.7.0-test.3.zip
      BASE_TAG: v1.7.0-test.2
      BASE_ASSET: SGP_ClientPatch_1.7.0-test.2.zip
      BASE_SHA: f1a0b2d47cc9f32958a9cf59124dadaecdbb1be4d746b884374fb4c7c677c081

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download exact published test.2
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing same-version byte replacement." >&2
            exit 1
          fi
          gh release download "$BASE_TAG" --repo "$REPO" -p "$BASE_ASSET"
          echo "$BASE_SHA  $BASE_ASSET" | sha256sum -c -
          unzip -t "$BASE_ASSET" >/dev/null

      - name: Build and statically audit cumulative test.3
        run: python3 release-staging/1.7.0-test.3/build_test3.py

      - name: Upload audited workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ClientPatch_1.7.0-test.3_AUDITED
          path: SGP_ClientPatch_1.7.0-test.3.zip
          retention-days: 7
          if-no-files-found: error

      - name: Publish exact GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          cat > release-notes.md <<'EOF'
          ## SGP Client 1.7.0-test.3

          Cumulative TEST planned stable линии **1.7.0**.

          - Прямое обновление со всех accepted stable **1.0.0–1.6.2**.
          - Forward repair с **1.7.0-test.1** и **1.7.0-test.2**.
          - Полная русская локализация всех 348 актуальных ключей Building Wands 3.0.5 через SGP RU Localization 1.8.
          - SGP Client Branding 1.2.2 отображает X.Y.Z-test.N на главном экране и корректно сравнивает prerelease/stable.
          - Gameplay payload Wands/Paxel/Fixes из test.2 не менялся.

          Owner Minecraft runtime test обязателен.
          EOF
          gh release create "$TAG" "$ASSET"             --repo "$REPO"             --target "${{ github.sha }}"             --title "SGP Client 1.7.0-test.3"             --notes-file release-notes.md             --prerelease
          echo "$SHA" > expected.sha

      - name: Redownload and verify live exact asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat expected.sha)"
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r '.draft')" = "false"
          test "$(printf '%s' "$REL" | jq -r '.prerelease')" = "true"
          RID="$(printf '%s' "$REL" | jq -r '.id')"
          ASSETS="$(gh api "repos/$REPO/releases/$RID/assets")"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "$ASSET"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].state')" = "uploaded"
          AID="$(printf '%s' "$ASSETS" | jq -r '.[0].id')"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > verify.zip
          ACTUAL="$(sha256sum verify.zip | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          unzip -t verify.zip >/dev/null
          python3 - <<'PY'
          import json, zipfile, hashlib
          with zipfile.ZipFile("verify.zip") as z:
              p=json.loads(z.read("patch.json"))
              assert p["patchId"]=="sgp-client-1.7.0-test.3"
              assert p["toVersion"]=="1.7.0-test.3"
              assert p["fromVersions"][-2:]==["1.7.0-test.1","1.7.0-test.2"]
              assert "files/mods/SGP-Client-Branding-1.2.2.jar" in z.namelist()
              assert hashlib.sha256(z.read("files/mods/SGP-Client-Branding-1.2.2.jar")).hexdigest()=="cac3fa22d7189615dcc4a329e2ac1d39c3eba9e018c3daa11c751a7fe14a6d90"
          print("LIVE_PRERELEASE_VERIFY_PASS")
          PY
          echo "PUBLISHED_RELEASE_ID=$RID"
          echo "PUBLISHED_ASSET_ID=$AID"
          echo "PUBLISHED_SHA=$EXPECTED"

      - name: Remove superseded test.2 from test channel
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$BASE_TAG" --repo "$REPO" --cleanup-tag -y
          if gh api "repos/$REPO/releases/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "Superseded test.2 release still exists." >&2
            exit 1
          fi
          echo "SUPERSEDED_TEST2_REMOVED"
# rerun-static-fix-1
# rerun-final-class-validation
