name: Verify SGP Client 1.7.0-test.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.3.yml"

permissions:
  contents: read

jobs:
  verify-published-test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.7.0-test.3
      ASSET: SGP_ClientPatch_1.7.0-test.3.zip
      EXPECTED_SHA: c6d98a99d0c36c228ebd69b6a097936d2ddbe35399b1167854900165cdb5123f

    steps:
      - uses: actions/checkout@v4

      - name: Verify exact published prerelease
        shell: bash
        run: |
          set -euo pipefail
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r '.draft')" = "false"
          test "$(printf '%s' "$REL" | jq -r '.prerelease')" = "true"
          RID="$(printf '%s' "$REL" | jq -r '.id')"
          ASSETS="$(gh api "repos/$REPO/releases/$RID/assets")"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "$ASSET"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].state')" = "uploaded"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].digest')" = "sha256:$EXPECTED_SHA"
          AID="$(printf '%s' "$ASSETS" | jq -r '.[0].id')"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > verify.zip
          echo "$EXPECTED_SHA  verify.zip" | sha256sum -c -
          unzip -t verify.zip >/dev/null

          python3 - <<'PY'
          import hashlib, io, json, zipfile
          stable=["1.0.0","1.0.1","1.0.2","1.0.3","1.1.0","1.2.0","1.2.1","1.3.0","1.3.1","1.3.2","1.3.3","1.4.0","1.5.0","1.5.1","1.5.2","1.5.3","1.6.0","1.6.1","1.6.2"]
          with zipfile.ZipFile("verify.zip") as z:
              p=json.loads(z.read("patch.json"))
              assert p["patchId"]=="sgp-client-1.7.0-test.3"
              assert p["toVersion"]=="1.7.0-test.3"
              assert p["fromVersions"]==stable+["1.7.0-test.1","1.7.0-test.2"]
              brand=z.read("files/mods/SGP-Client-Branding-1.2.2.jar")
              assert hashlib.sha256(brand).hexdigest()=="4d4a754f6b1f17ef035e2282f96aabe79a5b9c4a1dd320b7a58b2fae6307d832"
              loc=z.read("files/config/paxi/resourcepacks/SGP_RU_Localization_MC1.21.1.zip")
              assert hashlib.sha256(loc).hexdigest()=="2dc1cb97a8f6be31bf3df326cc84355b49d82241b14498c922a87e80e8502a6d"
              with zipfile.ZipFile(io.BytesIO(brand)) as bz:
                  assert "assets/sgp_client_branding/textures/gui/sgp_logo.png" in bz.namelist()
              with zipfile.ZipFile(io.BytesIO(loc)) as lz:
                  ru=json.loads(lz.read("assets/wands/lang/ru_ru.json"))
                  assert len(ru)==348
                  assert ru["option.wands.check_advancements"]=="Проверять достижения"
          print("PUBLISHED TEST.3 EXACT VERIFY: PASS")
          PY

          if gh api "repos/$REPO/releases/tags/v1.7.0-test.2" >/dev/null 2>&1; then
            echo "Superseded test.2 is still in the test channel." >&2
            exit 1
          fi
          echo "SUPERSEDED TEST.2 ABSENT: PASS"
