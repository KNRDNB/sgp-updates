name: Build and audit SGP Server 2.1.1 Paxel compatibility parity
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-server-2.1.1.yml"
permissions:
  contents: read
  actions: read
jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact server 2.1.1 root overlay from published server 2.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 release-staging/server-2.1.1/build_server_211.py | tee build-server-211.log
      - name: Upload exact audited handoff without publishing or TEST
        uses: actions/upload-artifact@v4
        with:
          name: sgp-server-2.1.1-paxel-handoff
          if-no-files-found: error
          path: |
            SGP_ServerPatch_2.1.1.zip
            server211_audit.json
            build-server-211.log
