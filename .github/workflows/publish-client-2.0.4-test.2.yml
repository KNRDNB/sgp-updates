name: Publish SGP Client 2.0.4-test.2 Auto Protect TEST

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-2.0.4-test.2.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build addon, audit, publish and live-verify TEST
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/2.0.4-test.2/ci_publish_test2.sh
