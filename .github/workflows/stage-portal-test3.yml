name: Stage portal TEST3 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage-portal-test3.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy immutable TEST2 source to TEST3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf release-staging/1.9.1-test.3
          mkdir -p release-staging/1.9.1-test.3
          cp -a release-staging/1.9.1-test.2/portalmod release-staging/1.9.1-test.3/portalmod
          sed -i 's/mod_version=1.1.1/mod_version=1.1.2/' release-staging/1.9.1-test.3/portalmod/gradle.properties
          sed -i 's/version="1.1.1"/version="1.1.2"/' release-staging/1.9.1-test.3/portalmod/src/main/resources/META-INF/neoforge.mods.toml
          git add -A release-staging/1.9.1-test.3
          git commit -m 'Stage portal mod 1.1.2 for client 1.9.1-test.3'
          git push
