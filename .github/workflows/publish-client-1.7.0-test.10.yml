name: Publish SGP Client 1.7.0-test.10

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.10.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.7.0-test.10
      ASSET: SGP_ClientPatch_1.7.0-test.10.zip
      BASE_TAG: v1.7.0-test.9
      BASE_ASSET: SGP_ClientPatch_1.7.0-test.9.zip
      BASE_SHA: 315a9f26527e48b99f675bec3c8f18a6de03de0b001f659f37289863be8809e9

    steps:
      - uses: actions/checkout@v4

      - name: Download exact published test.9
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing same-version replacement." >&2
            exit 1
          fi
          gh release download "$BASE_TAG" --repo "$REPO" -p "$BASE_ASSET"
          echo "$BASE_SHA  $BASE_ASSET" | sha256sum -c -
          unzip -t "$BASE_ASSET" >/dev/null

      - name: Build and audit cumulative test.10
        shell: bash
        run: |
          set -euo pipefail
          python3 release-staging/1.7.0-test.10/build_test10.py
          sha256sum "$ASSET" | tee candidate.sha256

      - name: Upload exact audited candidate
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ClientPatch_1.7.0-test.10_AUDITED
          path: SGP_ClientPatch_1.7.0-test.10.zip
          retention-days: 7
          if-no-files-found: error

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          cat > release-notes.md <<'EOF'
          ## SGP Client 1.7.0-test.10

          Cumulative TEST planned stable линии **1.7.0**.

          - Прямое обновление со всех accepted stable **1.0.0–1.6.2**.
          - Forward repair с **1.7.0-test.1 … test.9**.
          - Branding **1.2.8** из test.9 сохранён без изменений: только жёлтый cube icon + Minecraft-текст «Версия SGP: <version>».
          - Create Rope Pulley: kinetics.contraptions.maxRopeLength = 512.
          - Настройка внесена точечным tomlEdit в config/create-server.toml; полный Create config не заменяется.
          - Все payload-файлы byte-identical к test.9.

          Для dedicated server тот же server-side параметр должен войти в matching server patch перед multiplayer rollout.
          Owner Minecraft runtime check обязателен перед stable 1.7.0.
          EOF
          gh release create "$TAG" "$ASSET" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "SGP Client 1.7.0-test.10" \
            --notes-file release-notes.md \
            --prerelease
          echo "$SHA" > expected.sha

      - name: Redownload and verify live asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat expected.sha)"
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r '.draft')" = "false"
          test "$(printf '%s' "$REL" | jq -r '.prerelease')" = "true"
          RID="$(printf '%s' "$REL" | jq -r '.id')"
          ASSETS="$(gh api "repos/$REPO/releases/$RID/assets")"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "$ASSET"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].state')" = "uploaded"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].digest')" = "sha256:$EXPECTED"
          AID="$(printf '%s' "$ASSETS" | jq -r '.[0].id')"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > verify.zip
          echo "$EXPECTED  verify.zip" | sha256sum -c -
          unzip -t verify.zip >/dev/null

          python3 - <<'PY'
          import hashlib, json, zipfile
          stable=["1.0.0","1.0.1","1.0.2","1.0.3","1.1.0","1.2.0","1.2.1","1.3.0","1.3.1","1.3.2","1.3.3","1.4.0","1.5.0","1.5.1","1.5.2","1.5.3","1.6.0","1.6.1","1.6.2"]
          tests=["1.7.0-test.1","1.7.0-test.2","1.7.0-test.3","1.7.0-test.4","1.7.0-test.5","1.7.0-test.6","1.7.0-test.7","1.7.0-test.8","1.7.0-test.9"]
          with zipfile.ZipFile("verify.zip") as z:
              p=json.loads(z.read("patch.json"))
              assert p["patchId"]=="sgp-client-1.7.0-test.10"
              assert p["toVersion"]=="1.7.0-test.10"
              assert p["fromVersions"]==stable+tests
              acts=[a for a in p["actions"] if a["actionId"]=="increase-create-rope-pulley-max-length-512"]
              assert len(acts)==1
              a=acts[0]
              assert a["type"]=="tomlEdit"
              assert a["target"]=="config/create-server.toml"
              assert a["edits"]==[{"op":"set","path":"kinetics.contraptions.maxRopeLength","value":512,"createIfMissing":False}]
              for x in p["actions"]:
                  if x["type"]=="copy":
                      data=z.read(x["source"])
                      assert len(data)==x["size"]
                      assert hashlib.sha256(data).hexdigest().lower()==x["sha256"].lower()
          print("LIVE TEST.10 SHA/ZIP/MANIFEST/CREATE-CONFIG: PASS")
          PY

          echo "PUBLISHED_RELEASE_ID=$RID"
          echo "PUBLISHED_ASSET_ID=$AID"
          echo "PUBLISHED_SHA=$EXPECTED"

      - name: Remove superseded untested test.9
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$BASE_TAG" --repo "$REPO" --cleanup-tag -y
          if gh api "repos/$REPO/releases/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "Superseded test.9 still exists." >&2
            exit 1
          fi
          echo "SUPERSEDED_TEST9_REMOVED"
