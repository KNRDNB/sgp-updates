name: Publish SGP Client 2.1.0-test.1 (Paxel full corrective TEST)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-2.1.0-test.1.yml"
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact upstream preflight, pinned JAR reuse, package guard, publish and live-byte verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/2.1.0-test.1/ci_publish_test1.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgp-client-2.1.0-test.1-evidence
          if-no-files-found: warn
          path: |
            SGP_ClientPatch_2.1.0-test.1.zip
            SGP_ClientPatch_2.1.0-test.1.meta.json
            SGP-Wands-Paxel-Compat-1.0.3.jar
            SGP-BetterNether-Quartz-Glass-Compat-1.0.0.jar
            client210_test1_audit.json
            exact-wands-ironworks-target-preflight.log
            paxel103-release-javap.txt
            build-client-210-test1.log
            release-client-210-test1-result.txt
            notes.md
