name: Publish SGP Client 2.0.10 Stable
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-2.0.10.yml"
permissions:
  contents: write
  actions: read
jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, publish and live-verify corrective 2.0.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/2.0.10/ci_publish_stable.sh
