name: Publish corrected cumulative SGP Client 2.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-2.0.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, audit, publish and live-verify corrected cumulative 2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/2.0.0/ci_publish_stable200.sh
