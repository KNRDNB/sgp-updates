name: Build SGP Server 2.0.6
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-server-2.0.6.yml"
permissions:
  contents: read
  actions: read
jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and audit exact server 2.0.6 recovery overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-staging/server-2.0.6/build_server_206.py | tee build-server-206.txt
      - name: Upload exact server handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgp-server-2.0.6-handoff
          if-no-files-found: error
          path: |
            SGP_ServerPatch_2.0.6.zip
            build-server-206.txt
            server206_sha.txt
            server206_size.txt
            server206_pack_sha.txt
            server206_pack_size.txt
            server206_history_sha.txt
            server206_history_size.txt
            server206_delete.txt
