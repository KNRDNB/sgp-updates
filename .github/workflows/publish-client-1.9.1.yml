# retry 2: remove stale BaseFire mixin from generated stable source
name: Publish SGP Client 1.9.1 stable and build server 1.3.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.9.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build, audit, publish stable and verify live asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/1.9.1/ci_publish_stable191.sh
      - name: Upload matching server 1.3.2
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ServerPatch_1.3.2
          path: SGP_ServerPatch_1.3.2.zip
          retention-days: 14
          if-no-files-found: error
