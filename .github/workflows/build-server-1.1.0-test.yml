name: Build SGP Server 1.1.0 TEST

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-server-1.1.0-test.yml"

permissions:
  contents: read

jobs:
  build-audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CLIENT_TAG: v1.7.0-test.16
      CLIENT_ASSET: SGP_ClientPatch_1.7.0-test.16.zip
      CLIENT_SHA: 80535ebbf29aa9167e8ef8408dcb907069561d95a9e0d5fe95a9764395b93419

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact owner-PASS client source
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$CLIENT_TAG" --repo "$REPO" -p "$CLIENT_ASSET"
          echo "$CLIENT_SHA  $CLIENT_ASSET" | sha256sum -c -
          unzip -t "$CLIENT_ASSET" >/dev/null

      - name: Build server TEST
        shell: bash
        run: |
          set -euo pipefail
          python3 release-staging/server-1.1.0/build_server_110.py
          sha256sum SGP_ServerPatch_1.1.0_TEST.zip | tee server.sha256

      - name: Exact Wands Mixin preflight
        shell: bash
        run: |
          set -euo pipefail
          WANDS=".work-server-110/server-root/mods/BuildingWands-neoforge-MC1.21.1-3.0.5.jar"
          COMPAT=".work-server-110/server-root/mods/SGP-Wands-Paxel-Compat-1.0.0.jar"
          javap -classpath "$COMPAT" -p -v sgp.wands.paxelcompat.mixin.WandPaxelMixin > mixin.txt
          grep -Fq "major version: 65" mixin.txt
          grep -Fq "org.spongepowered.asm.mixin.Mixin(" mixin.txt
          grep -Fq 'targets=["net.nicguzzo.wands.wand.Wand"]' mixin.txt
          grep -Fq "org.spongepowered.asm.mixin.injection.Inject(" mixin.txt
          grep -Fq "can_dig(Lnet/minecraft/world/level/block/state/BlockState;ZLnet/minecraft/world/item/ItemStack;)Z" mixin.txt
          grep -Fq "require=1" mixin.txt
          grep -Fq "cancellable=true" mixin.txt
          javap -classpath "$WANDS" -p -s net.nicguzzo.wands.wand.Wand > wands.txt
          grep -Fq "descriptor: (Lnet/minecraft/world/level/block/state/BlockState;ZLnet/minecraft/world/item/ItemStack;)Z" wands.txt
          echo "SERVER_WANDS_MIXIN_PREFLIGHT_PASS"

      - name: Targeted config editor audit
        shell: bash
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/config"
          cp release-staging/server-1.1.0/wands-base.json "$T/config/wands.json"
          cp release-staging/server-1.1.0/create-server-base.toml "$T/config/create-server.toml"
          cp .work-server-110/server-root/APPLY_CONFIG_CHANGES.sh "$T/APPLY_CONFIG_CHANGES.sh"
          (
            cd "$T"
            bash APPLY_CONFIG_CHANGES.sh
            bash APPLY_CONFIG_CHANGES.sh
          )
          python3 - "$T" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          w=json.loads((root/"config/wands.json").read_text())
          exp={
            "max_limit___increment_this_if_your_machine_can_handle_it":8192,
            "stone_wand_limit":128,
            "copper_wand_limit":256,
            "iron_wand_limit":512,
            "diamond_wand_limit":1024,
            "netherite_wand_limit":4096,
            "creative_wand_limit":8192,
          }
          for k,v in exp.items(): assert w[k]==v,(k,w[k])
          c=(root/"config/create-server.toml").read_text()
          assert c.count("maxRopeLength = 512")==1
          assert "maxRopeLength = 384" not in c
          print("SERVER_TARGETED_CONFIG_EDIT_PASS")
          PY

      - name: Upload exact server TEST archive
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ServerPatch_1.1.0_TEST
          path: SGP_ServerPatch_1.1.0_TEST.zip
          retention-days: 14
          if-no-files-found: error
