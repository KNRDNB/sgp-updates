name: Build SGP Server 2.0.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-server-2.0.4.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and audit exact server 2.0.4 root overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-staging/server-2.0.4/build_server_204.py | tee build-server-204.txt
      - name: Upload exact server handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgp-server-2.0.4-handoff
          if-no-files-found: error
          path: |
            SGP_ServerPatch_2.0.4.zip
            build-server-204.txt
            server204_sha.txt
            server204_size.txt
            server204_pack_sha.txt
            server204_pack_size.txt
            server204_history_sha.txt
            server204_history_size.txt
