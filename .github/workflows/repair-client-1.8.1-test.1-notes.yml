name: Repair SGP Client 1.8.1-test.1 notes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-client-1.8.1-test.1-notes.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.8.1-test.1
    steps:
      - name: Repair exact release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## SGP Client 1.8.1-test.1

          Performance hotfix TEST for Create × Chipped Mechanical Saw processing.

          - Removes the 1.8.0 datapack with **6,968 registered create:cutting recipes**.
          - Installs **SGP-Create-Chipped-Cutting-1.0.0.jar** instead.
          - Runtime bridge uses the same **277 Chipped 4.0.2 workbench family tags**, but only materializes candidates for the current saw input; it registers **zero** recipe JSONs.
          - Mechanical Saw filter selection and 50-tick processing are preserved.
          - Static route-equivalence audit proves the dynamic family model covers the same **6,968 family→output routes** as the old datapack.
          - No MineColonies, simulation-distance, JVM/GC or unrelated config changes.

          Runtime validation required:
          1. Verify representative Create × Chipped saw conversions, including an overlapping lantern family.
          2. Re-run spark under comparable load and compare SawBlockEntity/getRecipes, MSPT mean/p95 and TPS.

          Mod SHA-256: `38f6495c480a2d8c5208eb4e9d50ba5a9feeaf3ce41dbadb44d99eb77682f686`  
          Mod size: **11,288 bytes**  
          Client TEST SHA-256: `10cdfdcec2c34815cce6f6dc7293d5b52a2b6609a5c16b3ae0973f759d560952`  
          Matching server 1.2.1 candidate SHA-256: `e5f9c90f2c23bbd2683d4e18f1961167aec6a27a7e184ef548a3ef846b1d611d` (withheld until client TEST PASS).

          Minecraft 1.21.1 · NeoForge 21.1.249 · Create 6.0.10 · Chipped 4.0.2
          EOF
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          BODY="$(gh api "repos/$REPO/releases/tags/$TAG" --jq .body)"
          printf '%s' "$BODY" | grep -Fq '38f6495c480a2d8c5208eb4e9d50ba5a9feeaf3ce41dbadb44d99eb77682f686'
          printf '%s' "$BODY" | grep -Fq 'e5f9c90f2c23bbd2683d4e18f1961167aec6a27a7e184ef548a3ef846b1d611d'
          echo RELEASE_NOTES_REPAIR_PASS
