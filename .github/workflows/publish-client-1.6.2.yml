name: Publish SGP Client 1.6.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-client-1.6.2.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.6.2
      ASSET: SGP_ClientPatch_1.6.2.zip
      EXPECTED_SHA: 1a864e6187875304319418b09f1b48082b782b77130530686060f7eb442c8896
    steps:
      - uses: actions/checkout@v4

      - name: Recreate and validate exact accepted artifact
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release-staging/1.6.2/asset.b64 > "$ASSET"
          echo "$EXPECTED_SHA  $ASSET" | sha256sum -c -
          unzip -t "$ASSET" >/dev/null
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile("SGP_ClientPatch_1.6.2.zip") as z:
              names=set(z.namelist())
              assert "patch.json" in names
              p=json.loads(z.read("patch.json"))
          assert p["schemaVersion"] == 1
          assert p["patchId"] == "sgp-client-1.6.2"
          assert p["toVersion"] == "1.6.2"
          assert p["fromVersions"] == ["1.6.1"]
          assert len(p["actions"]) == 23
          assert all(a["type"] == "textReplaceExact" for a in p["actions"])
          assert all(a["target"] == "config/apotheosis/name_generation.cfg" for a in p["actions"])
          assert all(a["expectedOccurrences"] == 1 for a in p["actions"])
          assert all(a.get("alreadyAppliedText") for a in p["actions"])
          print("Static manifest validation: PASS")
          PY

      - name: Create Draft and verify exact asset
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release/tag $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          cat > notes.md <<'EOF'
          ## SGP Client 1.6.2

          Русификация генерации имён Apotheosis для Minecraft 1.21.1 / NeoForge 21.1.249.

          - Точечные изменения `config/apotheosis/name_generation.cfg`.
          - Полный config не заменяется.
          - Используется строгий `textReplaceExact` с `expectedOccurrences=1` и `alreadyAppliedText`.
          - Технические ключи, registry/material IDs и пустые material-группы не меняются.
          - Поддерживаемый переход: **1.6.1 → 1.6.2**.
          - Owner runtime test: PASS.
          - Final publication explicitly approved by owner.

          SHA-256: `1a864e6187875304319418b09f1b48082b782b77130530686060f7eb442c8896`
          EOF
          gh release create "$TAG" "$ASSET" --repo "$REPO" --title "SGP Client 1.6.2" --notes-file notes.md --draft
          test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.draft')" = "true"
          mkdir verify
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir verify
          echo "$EXPECTED_SHA  verify/$ASSET" | sha256sum -c -
          unzip -t "verify/$ASSET" >/dev/null
          echo "Draft exact-asset verification: PASS"

      - name: Publish stable and live-public smoke
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease=false
          sleep 2
          test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.draft')" = "false"
          curl -fL --retry 3 "https://github.com/$REPO/releases/download/$TAG/$ASSET" -o live.zip
          if [ "$(sha256sum live.zip | awk '{print $1}')" != "$EXPECTED_SHA" ]; then
            gh release edit "$TAG" --repo "$REPO" --draft=true || true
            echo "Live public SHA mismatch; returned release to Draft." >&2
            exit 1
          fi
          unzip -t live.zip >/dev/null
          echo "Live-public smoke: PASS"
