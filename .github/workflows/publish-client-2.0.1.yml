name: Publish SGP Client 2.0.1 and build server 2.0.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-2.0.1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, audit, publish client 2.0.1 and build server 2.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/2.0.1/ci_publish_201.sh
      - name: Upload matching server 2.0.1
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ServerPatch_2.0.1
          path: SGP_ServerPatch_2.0.1.zip
          retention-days: 14
          if-no-files-found: error
