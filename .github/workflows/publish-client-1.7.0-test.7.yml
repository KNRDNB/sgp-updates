name: Publish SGP Client 1.7.0-test.7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.7.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.7.0-test.7
      ASSET: SGP_ClientPatch_1.7.0-test.7.zip
      BASE_TAG: v1.7.0-test.6
      BASE_ASSET: SGP_ClientPatch_1.7.0-test.6.zip
      BASE_SHA: 26fd1cd38a1e518e873872f9732a631c4a6338d31dbaf1842145a34187a52426

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download exact published test.6
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing same-version replacement." >&2
            exit 1
          fi
          gh release download "$BASE_TAG" --repo "$REPO" -p "$BASE_ASSET"
          echo "$BASE_SHA  $BASE_ASSET" | sha256sum -c -
          unzip -t "$BASE_ASSET" >/dev/null

      - name: Build and audit cumulative test.7
        shell: bash
        run: |
          set -euo pipefail
          python3 release-staging/1.7.0-test.7/build_test7.py
          sha256sum "$ASSET" | tee candidate.sha256
          echo "BRAND_SHA=$(cat test7_brand_sha.txt)"
          echo "BRAND_SIZE=$(cat test7_brand_size.txt)"

      - name: Upload exact audited candidate
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ClientPatch_1.7.0-test.7_AUDITED
          path: SGP_ClientPatch_1.7.0-test.7.zip
          retention-days: 7
          if-no-files-found: error

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          cat > release-notes.md <<'EOF'
          ## SGP Client 1.7.0-test.7

          Cumulative TEST planned stable линии **1.7.0**.

          - Прямое обновление со всех accepted stable **1.0.0–1.6.2**.
          - Forward repair с **1.7.0-test.1 … test.6**.
          - **SGP Client Branding 1.2.6**: новый high-quality UI logo **96×37**.
          - Исходный прозрачный логотип сначала tight-cropped, затем уменьшен premultiplied-alpha high-quality resampling; очень слабый fringe alpha <12 удалён, нормальное сглаживание сохранено.
          - Runtime scaling отсутствует: logo рисуется **1:1**, nearest filtering.
          - Logo занимает x=8..104, текст плашки начинается с x=108 — наложения быть не может.
          - Все non-Branding payload byte-identical к test.6.

          Owner Minecraft runtime visual check обязателен перед stable 1.7.0.
          EOF
          gh release create "$TAG" "$ASSET"             --repo "$REPO"             --target "${{ github.sha }}"             --title "SGP Client 1.7.0-test.7"             --notes-file release-notes.md             --prerelease
          echo "$SHA" > expected.sha

      - name: Redownload and verify live asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat expected.sha)"
          BRAND_SHA="$(cat test7_brand_sha.txt)"
          BRAND_SIZE="$(cat test7_brand_size.txt)"
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r '.draft')" = "false"
          test "$(printf '%s' "$REL" | jq -r '.prerelease')" = "true"
          RID="$(printf '%s' "$REL" | jq -r '.id')"
          ASSETS="$(gh api "repos/$REPO/releases/$RID/assets")"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "$ASSET"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].state')" = "uploaded"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].digest')" = "sha256:$EXPECTED"
          AID="$(printf '%s' "$ASSETS" | jq -r '.[0].id')"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > verify.zip
          echo "$EXPECTED  verify.zip" | sha256sum -c -
          unzip -t verify.zip >/dev/null

          python3 - "$BRAND_SHA" "$BRAND_SIZE" <<'PY'
          import hashlib, io, json, struct, sys, zipfile
          brand_sha=sys.argv[1]; brand_size=int(sys.argv[2])
          stable=["1.0.0","1.0.1","1.0.2","1.0.3","1.1.0","1.2.0","1.2.1","1.3.0","1.3.1","1.3.2","1.3.3","1.4.0","1.5.0","1.5.1","1.5.2","1.5.3","1.6.0","1.6.1","1.6.2"]
          with zipfile.ZipFile("verify.zip") as z:
              p=json.loads(z.read("patch.json"))
              assert p["patchId"]=="sgp-client-1.7.0-test.7"
              assert p["toVersion"]=="1.7.0-test.7"
              assert p["fromVersions"]==stable+["1.7.0-test.1","1.7.0-test.2","1.7.0-test.3","1.7.0-test.4","1.7.0-test.5","1.7.0-test.6"]
              assert "files/mods/SGP-Client-Branding-1.2.5.jar" not in z.namelist()
              brand=z.read("files/mods/SGP-Client-Branding-1.2.6.jar")
              assert len(brand)==brand_size
              assert hashlib.sha256(brand).hexdigest()==brand_sha
              with zipfile.ZipFile(io.BytesIO(brand)) as bz:
                  toml=bz.read("META-INF/neoforge.mods.toml").decode()
                  assert 'version="1.2.6"' in toml
                  logo=bz.read("assets/sgp_client_branding/textures/gui/sgp_logo.png")
                  assert hashlib.sha256(logo).hexdigest()=="f02276b4a3165d2048794a81c3ff8fe8d7d5da3d0146ae215aeae5f9bcbf9f17"
                  assert logo[:8]==b"\x89PNG\r\n\x1a\n"
                  assert int.from_bytes(logo[16:20],"big")==96
                  assert int.from_bytes(logo[20:24],"big")==37
          print("LIVE TEST.7 SHA/ZIP/MANIFEST/BRANDING: PASS")
          PY

          echo "PUBLISHED_RELEASE_ID=$RID"
          echo "PUBLISHED_ASSET_ID=$AID"
          echo "PUBLISHED_SHA=$EXPECTED"
          echo "PUBLISHED_BRAND_SHA=$BRAND_SHA"
          echo "PUBLISHED_BRAND_SIZE=$BRAND_SIZE"

      - name: Remove superseded failed test.6
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$BASE_TAG" --repo "$REPO" --cleanup-tag -y
          if gh api "repos/$REPO/releases/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "Superseded test.6 still exists." >&2
            exit 1
          fi
          echo "SUPERSEDED_TEST6_REMOVED"
