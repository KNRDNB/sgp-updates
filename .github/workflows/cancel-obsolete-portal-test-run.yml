name: Cancel obsolete portal TEST publish run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-obsolete-portal-test-run.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 37383592836 --repo KNRDNB/sgp-updates
