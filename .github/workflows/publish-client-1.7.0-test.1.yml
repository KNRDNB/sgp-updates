name: Publish SGP Client 1.7.0-test.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-client-1.7.0-test.1.yml"

permissions:
  contents: write

jobs:
  publish-test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish and verify exact prerelease
        shell: bash
        run: bash release-staging/1.7.0-test.1/publish.sh
