name: Rewrite and publish SGP Client 2.0.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rewrite-publish-client-2.0.1.yml"
      - "release-staging/2.0.1-rewrite/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build, audit, replace orphan tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/2.0.1-rewrite/ci_publish_201_rewrite.sh
      - name: Upload exact release evidence
        uses: actions/upload-artifact@v4
        with:
          name: client-2.0.1-rewrite-evidence
          path: |
            SGP_ClientPatch_2.0.1.zip
            SGP_ClientPatch_2.0.1.meta.json
            client-201-rewrite-build.txt
            client-201-rewrite-result.txt
            branding1215_sha.txt
            branding1215_size.txt
          retention-days: 30
          if-no-files-found: error
