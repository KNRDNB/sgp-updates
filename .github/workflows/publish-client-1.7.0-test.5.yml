name: Publish SGP Client 1.7.0-test.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.5.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.7.0-test.5
      ASSET: SGP_ClientPatch_1.7.0-test.5.zip
      BASE_TAG: v1.7.0-test.4
      BASE_ASSET: SGP_ClientPatch_1.7.0-test.4.zip
      BASE_SHA: 4a2ca6d37cce136558db7fdf1baa92c3dcb38084780d2b455af2e0fd83d5fe2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download exact published test.4
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing same-version replacement." >&2
            exit 1
          fi
          gh release download "$BASE_TAG" --repo "$REPO" -p "$BASE_ASSET"
          echo "$BASE_SHA  $BASE_ASSET" | sha256sum -c -
          unzip -t "$BASE_ASSET" >/dev/null

      - name: Build and audit cumulative test.5
        shell: bash
        run: |
          set -euo pipefail
          python3 release-staging/1.7.0-test.5/build_test5.py
          sha256sum "$ASSET" | tee candidate.sha256

      - name: Upload exact audited candidate
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ClientPatch_1.7.0-test.5_AUDITED
          path: SGP_ClientPatch_1.7.0-test.5.zip
          retention-days: 7
          if-no-files-found: error

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          cat > release-notes.md <<'EOF'
          ## SGP Client 1.7.0-test.5

          Cumulative TEST planned stable линии **1.7.0**.

          - Прямое обновление со всех accepted stable **1.0.0–1.6.2**.
          - Forward repair с **1.7.0-test.1 / test.2 / test.3 / test.4**.
          - **SGP Client Branding 1.2.4**: исправлена обрезка логотипа. Test.4 использовал overload, где 72×24 одновременно задавали draw size и source region, поэтому из texture 144×48 читалась только левая половина.
          - Теперь вся source texture **144×48** масштабируется в **72×24**.
          - Прозрачность, linear filtering, постоянная плашка, prerelease SemVer и update-state сохранены.
          - Все non-Branding payload byte-identical к test.4.

          Owner Minecraft runtime test обязателен перед stable 1.7.0.
          EOF
          gh release create "$TAG" "$ASSET"             --repo "$REPO"             --target "${{ github.sha }}"             --title "SGP Client 1.7.0-test.5"             --notes-file release-notes.md             --prerelease
          echo "$SHA" > expected.sha

      - name: Redownload and verify live asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat expected.sha)"
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r '.draft')" = "false"
          test "$(printf '%s' "$REL" | jq -r '.prerelease')" = "true"
          RID="$(printf '%s' "$REL" | jq -r '.id')"
          ASSETS="$(gh api "repos/$REPO/releases/$RID/assets")"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "$ASSET"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].state')" = "uploaded"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].digest')" = "sha256:$EXPECTED"
          AID="$(printf '%s' "$ASSETS" | jq -r '.[0].id')"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > verify.zip
          echo "$EXPECTED  verify.zip" | sha256sum -c -
          unzip -t verify.zip >/dev/null
          python3 - <<'PY'
          import hashlib, io, json, zipfile
          stable=["1.0.0","1.0.1","1.0.2","1.0.3","1.1.0","1.2.0","1.2.1","1.3.0","1.3.1","1.3.2","1.3.3","1.4.0","1.5.0","1.5.1","1.5.2","1.5.3","1.6.0","1.6.1","1.6.2"]
          with zipfile.ZipFile("verify.zip") as z:
              p=json.loads(z.read("patch.json"))
              assert p["patchId"]=="sgp-client-1.7.0-test.5"
              assert p["toVersion"]=="1.7.0-test.5"
              assert p["fromVersions"]==stable+["1.7.0-test.1","1.7.0-test.2","1.7.0-test.3","1.7.0-test.4"]
              assert "files/mods/SGP-Client-Branding-1.2.3.jar" not in z.namelist()
              brand=z.read("files/mods/SGP-Client-Branding-1.2.4.jar")
              with zipfile.ZipFile(io.BytesIO(brand)) as bz:
                  toml=bz.read("META-INF/neoforge.mods.toml").decode()
                  assert 'version="1.2.4"' in toml
                  logo=bz.read("assets/sgp_client_branding/textures/gui/sgp_logo.png")
                  assert int.from_bytes(logo[16:20],"big")==144
                  assert int.from_bytes(logo[20:24],"big")==48
          print("LIVE TEST.5 SHA/ZIP/MANIFEST/BRANDING: PASS")
          PY
          echo "PUBLISHED_RELEASE_ID=$RID"
          echo "PUBLISHED_ASSET_ID=$AID"
          echo "PUBLISHED_SHA=$EXPECTED"

      - name: Remove superseded failed test.4
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$BASE_TAG" --repo "$REPO" --cleanup-tag -y
          if gh api "repos/$REPO/releases/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "Superseded test.4 still exists." >&2
            exit 1
          fi
          echo "SUPERSEDED_TEST4_REMOVED"
