name: Publish SGP Client 1.7.0-test.14 v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.14-v2.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.7.0-test.14
      ASSET: SGP_ClientPatch_1.7.0-test.14.zip
      BASE_TAG: v1.7.0-test.13
      BASE_ASSET: SGP_ClientPatch_1.7.0-test.13.zip
      BASE_SHA: ffb4028ff1a4ab22c92a3b9c3f6ef7312796ff69f5dd791210e8af77b6f181b7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact test.13
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release already exists" >&2
            exit 1
          fi
          gh release download "$BASE_TAG" --repo "$REPO" -p "$BASE_ASSET"
          echo "$BASE_SHA  $BASE_ASSET" | sha256sum -c -
          unzip -t "$BASE_ASSET" >/dev/null

      - name: Build test.14
        shell: bash
        run: |
          set -euo pipefail
          python3 release-staging/1.7.0-test.14/build_test14.py
          sha256sum "$ASSET" | tee candidate.sha256

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          cat > notes.md <<'EOF'
          ## SGP Client 1.7.0-test.14

          - Branding 1.2.12 keeps the accepted test.13 cube/text geometry.
          - Adds 6 GUI px of right-side breathing room: plaque x=169 -> x=175.
          - Plaque width is still fixed in this iteration; it is not auto-sized from the font width.
          - Create Rope Pulley maxRopeLength=512 remains unchanged.
          - All non-Branding payload/actions are unchanged from test.13.
          EOF
          gh release create "$TAG" "$ASSET" --repo "$REPO" --target "${{ github.sha }}" --title "SGP Client 1.7.0-test.14" --notes-file notes.md --prerelease
          echo "$SHA" > expected.sha

      - name: Verify live asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat expected.sha)"
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          RID="$(printf '%s' "$REL" | jq -r '.id')"
          ASSETS="$(gh api "repos/$REPO/releases/$RID/assets")"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "$ASSET"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].digest')" = "sha256:$EXPECTED"
          AID="$(printf '%s' "$ASSETS" | jq -r '.[0].id')"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > verify.zip
          echo "$EXPECTED  verify.zip" | sha256sum -c -
          unzip -t verify.zip >/dev/null
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile("verify.zip") as z:
              p=json.loads(z.read("patch.json"))
              assert p["patchId"]=="sgp-client-1.7.0-test.14"
              assert p["toVersion"]=="1.7.0-test.14"
              assert any(a.get("actionId")=="increase-create-rope-pulley-max-length-512" for a in p["actions"])
              assert "files/mods/SGP-Client-Branding-1.2.12.jar" in z.namelist()
          print("LIVE TEST.14 VERIFY: PASS")
          PY
          echo "PUBLISHED_RELEASE_ID=$RID"
          echo "PUBLISHED_ASSET_ID=$AID"
          echo "PUBLISHED_SHA=$EXPECTED"

      - name: Remove superseded test.13
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$BASE_TAG" --repo "$REPO" --cleanup-tag -y
          if gh api "repos/$REPO/releases/tags/$BASE_TAG" >/dev/null 2>&1; then
            exit 1
          fi
          echo "SUPERSEDED_TEST13_REMOVED"
