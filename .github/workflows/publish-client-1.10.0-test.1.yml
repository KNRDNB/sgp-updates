# retry 2: resolve Puzzles Lib by exact NeoForge filename
name: Publish SGP Client 1.10.0-test.1 HUD + Permanent Sponges TEST

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.10.0-test.1.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, audit, publish and live-verify TEST1
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/1.10.0-test.1/ci_publish_test1.sh
