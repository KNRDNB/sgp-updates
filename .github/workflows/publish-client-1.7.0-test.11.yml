name: Publish SGP Client 1.7.0-test.11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.11.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.7.0-test.11
      ASSET: SGP_ClientPatch_1.7.0-test.11.zip
      BASE_TAG: v1.7.0-test.10
      BASE_ASSET: SGP_ClientPatch_1.7.0-test.10.zip
      BASE_SHA: b8f53a115645d16e5ee678100a1f908e2320d86f8c886d81a544f8e23757c42b

    steps:
      - uses: actions/checkout@v4

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact published test.10
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing same-version replacement." >&2
            exit 1
          fi
          gh release download "$BASE_TAG" --repo "$REPO" -p "$BASE_ASSET"
          echo "$BASE_SHA  $BASE_ASSET" | sha256sum -c -
          unzip -t "$BASE_ASSET" >/dev/null

      - name: Build and audit cumulative test.11
        shell: bash
        run: |
          set -euo pipefail
          python3 release-staging/1.7.0-test.11/build_test11.py
          sha256sum "$ASSET" | tee candidate.sha256
          echo "BRAND_SHA=$(cat test11_brand_sha.txt)"
          echo "BRAND_SIZE=$(cat test11_brand_size.txt)"
          echo "CUBE_SHA=$(cat test11_cube_sha.txt)"
          echo "CUBE_SIZE=$(cat test11_cube_size.txt)"

      - name: Upload exact audited candidate
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ClientPatch_1.7.0-test.11_AUDITED
          path: SGP_ClientPatch_1.7.0-test.11.zip
          retention-days: 7
          if-no-files-found: error

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          cat > release-notes.md <<'EOF'
          ## SGP Client 1.7.0-test.11

          Cumulative TEST planned stable линии **1.7.0**.

          - Прямое обновление со всех accepted stable **1.0.0–1.6.2**.
          - Forward repair с **1.7.0-test.1 … test.10**.
          - **Branding 1.2.9**: куб восстановлен из exact SHA-verified clean raster, который использовался в test.5.
          - Из старого raster сохранён только левый **48×48 cube cell**; raster-надпись **SGP** не возвращалась.
          - Геометрия куба как в test.5: source **48×48 → 24×24**, x=8, y=12, linear filtering.
          - Версия остаётся Minecraft-текстом: **«Версия SGP: <version>»**.
          - Create Rope Pulley **maxRopeLength=512** из test.10 сохранён.
          - Все non-Branding payload/actions byte-identical к test.10.

          Owner Minecraft runtime visual check обязателен перед stable 1.7.0.
          EOF
          gh release create "$TAG" "$ASSET" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "SGP Client 1.7.0-test.11" \
            --notes-file release-notes.md \
            --prerelease
          echo "$SHA" > expected.sha

      - name: Redownload and verify live asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat expected.sha)"
          BRAND_SHA="$(cat test11_brand_sha.txt)"
          BRAND_SIZE="$(cat test11_brand_size.txt)"
          CUBE_SHA="$(cat test11_cube_sha.txt)"

          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r '.draft')" = "false"
          test "$(printf '%s' "$REL" | jq -r '.prerelease')" = "true"
          RID="$(printf '%s' "$REL" | jq -r '.id')"
          ASSETS="$(gh api "repos/$REPO/releases/$RID/assets")"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "$ASSET"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].state')" = "uploaded"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].digest')" = "sha256:$EXPECTED"
          AID="$(printf '%s' "$ASSETS" | jq -r '.[0].id')"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > verify.zip
          echo "$EXPECTED  verify.zip" | sha256sum -c -
          unzip -t verify.zip >/dev/null

          python3 - "$BRAND_SHA" "$BRAND_SIZE" "$CUBE_SHA" <<'PY'
          import hashlib, io, json, sys, zipfile
          brand_sha=sys.argv[1]; brand_size=int(sys.argv[2]); cube_sha=sys.argv[3]
          stable=["1.0.0","1.0.1","1.0.2","1.0.3","1.1.0","1.2.0","1.2.1","1.3.0","1.3.1","1.3.2","1.3.3","1.4.0","1.5.0","1.5.1","1.5.2","1.5.3","1.6.0","1.6.1","1.6.2"]
          tests=["1.7.0-test.1","1.7.0-test.2","1.7.0-test.3","1.7.0-test.4","1.7.0-test.5","1.7.0-test.6","1.7.0-test.7","1.7.0-test.8","1.7.0-test.9","1.7.0-test.10"]
          with zipfile.ZipFile("verify.zip") as z:
              p=json.loads(z.read("patch.json"))
              assert p["patchId"]=="sgp-client-1.7.0-test.11"
              assert p["toVersion"]=="1.7.0-test.11"
              assert p["fromVersions"]==stable+tests
              rope=[a for a in p["actions"] if a.get("actionId")=="increase-create-rope-pulley-max-length-512"]
              assert len(rope)==1 and rope[0]["edits"][0]["value"]==512
              assert "files/mods/SGP-Client-Branding-1.2.8.jar" not in z.namelist()
              brand=z.read("files/mods/SGP-Client-Branding-1.2.9.jar")
              assert len(brand)==brand_size
              assert hashlib.sha256(brand).hexdigest()==brand_sha
              with zipfile.ZipFile(io.BytesIO(brand)) as bz:
                  logo=bz.read("assets/sgp_client_branding/textures/gui/sgp_logo.png")
                  assert hashlib.sha256(logo).hexdigest()==cube_sha
                  assert int.from_bytes(logo[16:20],"big")==48
                  assert int.from_bytes(logo[20:24],"big")==48
                  toml=bz.read("META-INF/neoforge.mods.toml").decode()
                  assert 'version="1.2.9"' in toml
              for a in p["actions"]:
                  if a["type"]=="copy":
                      data=z.read(a["source"])
                      assert len(data)==a["size"]
                      assert hashlib.sha256(data).hexdigest().lower()==a["sha256"].lower()
          print("LIVE TEST.11 SHA/ZIP/MANIFEST/BRANDING/CREATE-CONFIG: PASS")
          PY

          echo "PUBLISHED_RELEASE_ID=$RID"
          echo "PUBLISHED_ASSET_ID=$AID"
          echo "PUBLISHED_SHA=$EXPECTED"
          echo "PUBLISHED_BRAND_SHA=$BRAND_SHA"
          echo "PUBLISHED_BRAND_SIZE=$BRAND_SIZE"
          echo "PUBLISHED_CUBE_SHA=$CUBE_SHA"

      - name: Remove superseded test.10
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$BASE_TAG" --repo "$REPO" --cleanup-tag -y
          if gh api "repos/$REPO/releases/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "Superseded test.10 still exists." >&2
            exit 1
          fi
          echo "SUPERSEDED_TEST10_REMOVED"
