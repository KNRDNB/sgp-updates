name: Publish SGP Client 1.7.0-test.16

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.16.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.7.0-test.16
      ASSET: SGP_ClientPatch_1.7.0-test.16.zip
      BASE_TAG: v1.7.0-test.15
      BASE_ASSET: SGP_ClientPatch_1.7.0-test.15.zip
      BASE_SHA: 1c383f4e91c0462d581881dc570d087af7ae394b54d64cc27e94e6e7146a17ba

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact test.15
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release already exists" >&2
            exit 1
          fi
          gh release download "$BASE_TAG" --repo "$REPO" -p "$BASE_ASSET"
          echo "$BASE_SHA  $BASE_ASSET" | sha256sum -c -
          unzip -t "$BASE_ASSET" >/dev/null

      - name: Build and audit test.16
        shell: bash
        run: |
          set -euo pipefail
          python3 release-staging/1.7.0-test.16/build_test16.py
          sha256sum "$ASSET" | tee candidate.sha256
          echo "BRAND_SHA=$(cat test16_brand_sha.txt)"
          echo "BRAND_SIZE=$(cat test16_brand_size.txt)"

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          cat > notes.md <<'EOF'
          ## SGP Client 1.7.0-test.16

          - Normal state is unchanged from test.15.
          - Update-state text is vertically centered relative to the cube:
            - line 1 y: 9 -> 12
            - line 2 y: 25 -> 28
          - Update button y: 12 -> 14, centering the 20px button around the same axis.
          - Dynamic plaque width, cube geometry, right padding and button X logic are unchanged.
          - Create Rope Pulley maxRopeLength=512 remains unchanged.

          Please verify both normal and update states; normal must remain visually identical to test.15.
          EOF
          gh release create "$TAG" "$ASSET" --repo "$REPO" --target "${{ github.sha }}" --title "SGP Client 1.7.0-test.16" --notes-file notes.md --prerelease
          echo "$SHA" > expected.sha

      - name: Verify live asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat expected.sha)"
          BRAND_SHA="$(cat test16_brand_sha.txt)"
          BRAND_SIZE="$(cat test16_brand_size.txt)"
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          RID="$(printf '%s' "$REL" | jq -r '.id')"
          ASSETS="$(gh api "repos/$REPO/releases/$RID/assets")"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "$ASSET"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].digest')" = "sha256:$EXPECTED"
          AID="$(printf '%s' "$ASSETS" | jq -r '.[0].id')"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > verify.zip
          echo "$EXPECTED  verify.zip" | sha256sum -c -
          unzip -t verify.zip >/dev/null
          python3 - "$BRAND_SHA" "$BRAND_SIZE" <<'PY'
          import hashlib, json, sys, zipfile
          brand_sha=sys.argv[1]; brand_size=int(sys.argv[2])
          with zipfile.ZipFile("verify.zip") as z:
              p=json.loads(z.read("patch.json"))
              assert p["patchId"]=="sgp-client-1.7.0-test.16"
              assert p["toVersion"]=="1.7.0-test.16"
              brand=z.read("files/mods/SGP-Client-Branding-1.2.14.jar")
              assert len(brand)==brand_size
              assert hashlib.sha256(brand).hexdigest()==brand_sha
              assert any(a.get("actionId")=="increase-create-rope-pulley-max-length-512" for a in p["actions"])
          print("LIVE TEST.16 VERIFY: PASS")
          PY
          echo "PUBLISHED_RELEASE_ID=$RID"
          echo "PUBLISHED_ASSET_ID=$AID"
          echo "PUBLISHED_SHA=$EXPECTED"

      - name: Remove superseded test.15
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$BASE_TAG" --repo "$REPO" --cleanup-tag -y
          if gh api "repos/$REPO/releases/tags/$BASE_TAG" >/dev/null 2>&1; then
            exit 1
          fi
          echo "SUPERSEDED_TEST15_REMOVED"
