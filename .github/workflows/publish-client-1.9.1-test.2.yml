name: Publish SGP Client 1.9.1-test.2 portal TEST

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.9.1-test.2.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build, audit, publish and live-verify TEST2
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/1.9.1-test.2/ci_publish_test2.sh
      - name: Upload matching server 1.3.2 candidate evidence only
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ServerPatch_1.3.2_CANDIDATE_DO_NOT_HANDOFF_BEFORE_CLIENT_PASS
          path: SGP_ServerPatch_1.3.2.zip
          retention-days: 14
          if-no-files-found: error
