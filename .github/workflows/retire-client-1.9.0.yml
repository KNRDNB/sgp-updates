name: Retire unverified SGP Client 1.9.0 stable

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-client-1.9.0.yml"

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Delete unverified stable release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'
          TAG='v1.9.0'
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" --cleanup-tag -y
          fi
          ! gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1
          ! gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1
          echo UNVERIFIED_STABLE_RETIRED_PASS
