name: Publish SGP Client 2.0.9 Stable
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-2.0.9.yml"
permissions:
  contents: write
  actions: read
jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind RU candidate, build, publish and live-verify 2.0.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/2.0.9/ci_publish_stable.sh
