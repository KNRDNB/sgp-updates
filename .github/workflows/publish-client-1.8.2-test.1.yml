name: Publish SGP Client 1.8.2-test.1 Soulbound charms

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.8.2-test.1.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, audit, publish and live-verify TEST
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/1.8.2-test.1/ci_publish_test1.sh
