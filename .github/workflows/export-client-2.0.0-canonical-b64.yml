name: Export SGP 2.0.0 canonical resource base64

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-client-2.0.0-canonical-b64.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export exact accepted resources as temporary base64 text
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v2.0.0 --repo KNRDNB/sgp-updates -p SGP_ClientPatch_2.0.0.zip
          echo 'aeab5276fcc92ba3f8c2375f87563c7a0ede0a2dee5b94e158b62bdab7ff2ef1  SGP_ClientPatch_2.0.0.zip' | sha256sum -c -
          python3 - <<'PY'
          import base64,hashlib,json,zipfile,pathlib
          z=zipfile.ZipFile('SGP_ClientPatch_2.0.0.zip')
          p=json.loads(z.read('patch.json'))
          targets={
            'config/paxi/datapacks/SGP_Fixes_NeoForge_1.21.1.zip':('fixes.b64','1c9b8e1a702b4a481dfd823e3535d2763b2ec92fc83abed4bbe0b18f8b419191'),
            'config/paxi/resourcepacks/SGP_RU_Localization_MC1.21.1.zip':('ru.b64','dd4319b2c501aa89c97710359d1a6ab8117bb53a42adee7021defaddda49386d')
          }
          outdir=pathlib.Path('release-staging/2.0.0/canonical-export')
          outdir.mkdir(parents=True,exist_ok=True)
          for target,(name,sha) in targets.items():
            a=next(x for x in p['actions'] if x.get('type')=='copy' and x.get('target')==target)
            b=z.read(a['source'])
            assert hashlib.sha256(b).hexdigest()==sha
            (outdir/name).write_text(base64.b64encode(b).decode('ascii')+'\n','ascii')
          print('CANONICAL_200_B64_EXPORT_PASS')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add release-staging/2.0.0/canonical-export/fixes.b64 release-staging/2.0.0/canonical-export/ru.b64
          git commit -m 'Temporary canonical 2.0.0 resource base64 export'
          git push
