name: Publish SGP Client 1.8.2 stable

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.8.2.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote exact runtime-PASS TEST to stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/1.8.2/ci_publish_stable182.sh
