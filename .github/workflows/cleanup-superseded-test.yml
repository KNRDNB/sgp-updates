name: Cleanup superseded client TEST

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-superseded-test.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OLD_TAG: v1.7.0-test.16
    steps:
      - name: Delete superseded TEST release and tag
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$OLD_TAG" --repo "$REPO" --cleanup-tag -y

          if gh api "repos/$REPO/releases/tags/$OLD_TAG" >/dev/null 2>&1; then
            echo "Old release still exists" >&2
            exit 1
          fi

          if gh api "repos/$REPO/git/ref/tags/$OLD_TAG" >/dev/null 2>&1; then
            echo "Old tag still exists" >&2
            exit 1
          fi

          echo "SUPERSEDED_TEST_DELETE_PASS"
