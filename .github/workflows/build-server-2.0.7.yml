name: Build SGP Server 2.0.7
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-server-2.0.7.yml"
permissions:
  contents: read
  actions: read
jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and audit exact server 2.0.7 overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-staging/server-2.0.7/build_server_207.py | tee build-server-207.txt
      - name: Upload exact server handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgp-server-2.0.7-handoff
          if-no-files-found: error
          path: |
            SGP_ServerPatch_2.0.7.zip
            build-server-207.txt
            server207_sha.txt
            server207_size.txt
            server207_pack_sha.txt
            server207_pack_size.txt
            server207_history_sha.txt
            server207_history_size.txt
            server207_delete.txt
