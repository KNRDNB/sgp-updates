name: Publish SGP Client 2.0.11-test.1 Paxel and Quartz Glass TEST
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-2.0.11-test.1.yml"
permissions:
  contents: write
jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compat, package, guard, publish and live-verify TEST
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-staging/2.0.11-test.1/ci_publish_test1.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgp-client-2.0.11-test.1-evidence-and-server-handoff
          if-no-files-found: error
          path: |
            SGP_ClientPatch_2.0.11-test.1.zip
            SGP_ClientPatch_2.0.11-test.1.meta.json
            SGP-Wands-Paxel-Compat-1.0.1.jar
            SGP_Server_TEST_2.1.0_WandsPaxelCompat_1.0.1.zip
            client2011_test1_audit.json
            release-client-2011-test1-result.txt
            build-client-2011-test1.txt
            paxel_compat_sha.txt
            paxel_compat_size.txt
            paxel-ids-javap.txt
            paxel-mixin-javap.txt
