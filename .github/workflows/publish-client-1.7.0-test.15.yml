name: Publish SGP Client 1.7.0-test.15

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-client-1.7.0-test.15.yml"

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.7.0-test.15
      ASSET: SGP_ClientPatch_1.7.0-test.15.zip
      BASE_TAG: v1.7.0-test.14
      BASE_ASSET: SGP_ClientPatch_1.7.0-test.14.zip
      BASE_SHA: f5d20ab12ef08b4f0fd0ac0c98ddd17f65db9e63146ee6820d45f0926297f0bc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact test.14
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release already exists" >&2
            exit 1
          fi
          gh release download "$BASE_TAG" --repo "$REPO" -p "$BASE_ASSET"
          echo "$BASE_SHA  $BASE_ASSET" | sha256sum -c -
          unzip -t "$BASE_ASSET" >/dev/null

      - name: Build and audit test.15
        shell: bash
        run: |
          set -euo pipefail
          python3 release-staging/1.7.0-test.15/build_test15.py
          sha256sum "$ASSET" | tee candidate.sha256
          echo "BRAND_SHA=$(cat test15_brand_sha.txt)"
          echo "BRAND_SIZE=$(cat test15_brand_size.txt)"

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          cat > notes.md <<'EOF'
          ## SGP Client 1.7.0-test.15

          - Branding 1.2.13 keeps the accepted test.14 cube/text geometry.
          - Plaque width is now dynamic using Minecraft Font.width(...).
          - Normal state measures the visible version line and adds 8 GUI px right padding.
          - Update state measures both visible update lines and uses the wider one, again with 8 GUI px padding.
          - The update button follows plaqueRight + 4 while retaining the existing screen-width clamp.
          - Create Rope Pulley maxRopeLength=512 remains unchanged.
          - All non-Branding payload/actions are unchanged from test.14.

          Please runtime-check both normal and update states.
          EOF
          gh release create "$TAG" "$ASSET" --repo "$REPO" --target "${{ github.sha }}" --title "SGP Client 1.7.0-test.15" --notes-file notes.md --prerelease
          echo "$SHA" > expected.sha

      - name: Verify live asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat expected.sha)"
          BRAND_SHA="$(cat test15_brand_sha.txt)"
          BRAND_SIZE="$(cat test15_brand_size.txt)"
          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r '.draft')" = "false"
          test "$(printf '%s' "$REL" | jq -r '.prerelease')" = "true"
          RID="$(printf '%s' "$REL" | jq -r '.id')"
          ASSETS="$(gh api "repos/$REPO/releases/$RID/assets")"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "$ASSET"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].digest')" = "sha256:$EXPECTED"
          AID="$(printf '%s' "$ASSETS" | jq -r '.[0].id')"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > verify.zip
          echo "$EXPECTED  verify.zip" | sha256sum -c -
          unzip -t verify.zip >/dev/null
          python3 - "$BRAND_SHA" "$BRAND_SIZE" <<'PY'
          import hashlib, io, json, sys, zipfile
          brand_sha=sys.argv[1]; brand_size=int(sys.argv[2])
          stable=["1.0.0","1.0.1","1.0.2","1.0.3","1.1.0","1.2.0","1.2.1","1.3.0","1.3.1","1.3.2","1.3.3","1.4.0","1.5.0","1.5.1","1.5.2","1.5.3","1.6.0","1.6.1","1.6.2"]
          tests=["1.7.0-test.1","1.7.0-test.2","1.7.0-test.3","1.7.0-test.4","1.7.0-test.5","1.7.0-test.6","1.7.0-test.7","1.7.0-test.8","1.7.0-test.9","1.7.0-test.10","1.7.0-test.11","1.7.0-test.12","1.7.0-test.13","1.7.0-test.14"]
          with zipfile.ZipFile("verify.zip") as z:
              p=json.loads(z.read("patch.json"))
              assert p["patchId"]=="sgp-client-1.7.0-test.15"
              assert p["toVersion"]=="1.7.0-test.15"
              assert p["fromVersions"]==stable+tests
              rope=[a for a in p["actions"] if a.get("actionId")=="increase-create-rope-pulley-max-length-512"]
              assert len(rope)==1 and rope[0]["edits"][0]["value"]==512
              assert "files/mods/SGP-Client-Branding-1.2.12.jar" not in z.namelist()
              brand=z.read("files/mods/SGP-Client-Branding-1.2.13.jar")
              assert len(brand)==brand_size
              assert hashlib.sha256(brand).hexdigest()==brand_sha
              with zipfile.ZipFile(io.BytesIO(brand)) as bz:
                  logo=bz.read("assets/sgp_client_branding/textures/gui/sgp_logo.png")
                  assert int.from_bytes(logo[16:20],"big")==58
                  assert int.from_bytes(logo[20:24],"big")==48
                  toml=bz.read("META-INF/neoforge.mods.toml").decode()
                  assert 'version="1.2.13"' in toml
                  cls=bz.read("sgp/client/branding/SgpClientBranding.class")
                  for s in ["Версия SGP: ","Доступно обновление","Новая версия: "]:
                      assert s.encode() in cls
              for a in p["actions"]:
                  if a["type"]=="copy":
                      data=z.read(a["source"])
                      assert len(data)==a["size"]
                      assert hashlib.sha256(data).hexdigest().lower()==a["sha256"].lower()
          print("LIVE TEST.15 VERIFY: PASS")
          PY
          echo "PUBLISHED_RELEASE_ID=$RID"
          echo "PUBLISHED_ASSET_ID=$AID"
          echo "PUBLISHED_SHA=$EXPECTED"

      - name: Remove superseded test.14
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$BASE_TAG" --repo "$REPO" --cleanup-tag -y
          if gh api "repos/$REPO/releases/tags/$BASE_TAG" >/dev/null 2>&1; then
            exit 1
          fi
          echo "SUPERSEDED_TEST14_REMOVED"

# rerun after locale-independent dynamic-width audit fix
