name: Verify client release title guard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-client-release-title-guard.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run release guard unit tests
        run: python -m unittest scripts/test_client_release_guard.py
