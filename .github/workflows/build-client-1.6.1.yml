name: Build SGP Client 1.6.1

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-client-1.6.1.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact SGP Client 1.6.0 release asset
        run: |
          set -euo pipefail
          curl -fL -o SGP_ClientPatch_1.6.0.zip \
            https://github.com/KNRDNB/sgp-updates/releases/download/v1.6.0/SGP_ClientPatch_1.6.0.zip
          echo "87c37a5bdbce358c0364c579bc2f6cae8bdc5bca9b36ff69b16b2c9edba5d811  SGP_ClientPatch_1.6.0.zip" | sha256sum -c -

      - name: Extract and patch manifest
        run: |
          set -euo pipefail
          mkdir work
          unzip -q SGP_ClientPatch_1.6.0.zip -d work
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("work/patch.json")
          data = json.loads(p.read_text(encoding="utf-8-sig"))

          if data.get("patchId") != "sgp-client-1.6.0":
              raise SystemExit(f"Unexpected patchId: {data.get('patchId')!r}")
          if data.get("name") != "SGP Client 1.6.0":
              raise SystemExit(f"Unexpected name: {data.get('name')!r}")
          if data.get("toVersion") != "1.6.0":
              raise SystemExit(f"Unexpected toVersion: {data.get('toVersion')!r}")

          data["patchId"] = "sgp-client-1.6.1"
          data["name"] = "SGP Client 1.6.1"
          data["toVersion"] = "1.6.1"

          versions = data.get("fromVersions")
          if not isinstance(versions, list):
              raise SystemExit("fromVersions is not a list")
          if "1.6.0" not in versions:
              versions.append("1.6.0")

          required = [
              "1.0.0","1.0.1","1.0.2","1.0.3","1.1.0","1.2.0","1.2.1",
              "1.3.0","1.3.1","1.3.2","1.3.3","1.4.0",
              "1.5.0","1.5.1","1.5.2","1.5.3","1.6.0"
          ]
          if versions != required:
              raise SystemExit(f"Unexpected cumulative fromVersions: {versions}")
          if "1.5.4" in versions:
              raise SystemExit("Unofficial 1.5.4 must not be accepted")

          summary = data.get("summary")
          if not isinstance(summary, list):
              raise SystemExit("summary is not a list")
          data["summary"] = [
              "SGP Client 1.6.1: hotfix синхронизации поиска JEI и Create Stock Keeper.",
              "Исправлено: строка поиска JEI больше не синхронизируется со строкой поиска Create Stock Keeper.",
              "Исправление применяется точечно к config/create-client.toml без замены пользовательского client config.",
              "Все изменения SGP Client 1.6.0 и предыдущих версий сохранены."
          ]

          actions = data.get("actions")
          if not isinstance(actions, list):
              raise SystemExit("actions is not a list")

          matches = [a for a in actions if a.get("actionId") == "decouple-create-stockkeeper-jei-search"]
          if len(matches) != 1:
              raise SystemExit(f"Expected one search-decouple action, got {len(matches)}")
          a = matches[0]
          if a.get("type") != "tomlEdit" or a.get("target") != "config/create-client.toml":
              raise SystemExit(f"Unexpected existing search-decouple action: {a}")

          replacement = {
              "actionId": "decouple-create-stockkeeper-jei-search",
              "type": "textReplaceExact",
              "description": "Развязать поиск Create Stock Keeper и JEI: исправить SYNC_BOTH на NONE без замены create-client.toml целиком",
              "target": "config/create-client.toml",
              "oldText": 'syncRecipeViewerSearch = "SYNC_BOTH"',
              "newText": 'syncRecipeViewerSearch = "NONE"',
              "expectedOccurrences": 1,
              "alreadyAppliedText": 'syncRecipeViewerSearch = "NONE"'
          }
          idx = actions.index(a)
          actions[idx] = replacement

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          readme = Path("work/README.txt")
          note = (
              "SGP Client 1.6.1\n"
              "================\n\n"
              "Minecraft 1.21.1 | NeoForge 21.1.249 | Java 21\n\n"
              "Hotfix:\n"
              "- исправлена синхронизация строк поиска JEI и Create Stock Keeper;\n"
              "- config/create-client.toml: syncRecipeViewerSearch = NONE;\n"
              "- изменение выполняется точечно, пользовательский create-client.toml целиком не заменяется.\n\n"
              "1.6.1 является cumulative patch и сохраняет полный target state SGP Client 1.6.0.\n"
              "Поддерживаемые source versions: 1.0.0-1.5.3 и 1.6.0.\n"
              "Неофициальный test 1.5.4 не поддерживается.\n"
          )
          readme.write_text(note, encoding="utf-8")
          PY

      - name: Static manifest validation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("work/patch.json").read_text(encoding="utf-8"))
          assert data["schemaVersion"] == 1
          assert data["patchId"] == "sgp-client-1.6.1"
          assert data["name"] == "SGP Client 1.6.1"
          assert data["targetPackId"] == "sgp-neoforge-1.21.1-client"
          assert data["minecraft"] == "1.21.1"
          assert data["neoforge"] == "21.1.249"
          assert data["toVersion"] == "1.6.1"
          assert data["fromVersions"][-1] == "1.6.0"
          assert "1.5.4" not in data["fromVersions"]

          a = next(x for x in data["actions"] if x["actionId"] == "decouple-create-stockkeeper-jei-search")
          assert a == {
              "actionId": "decouple-create-stockkeeper-jei-search",
              "type": "textReplaceExact",
              "description": "Развязать поиск Create Stock Keeper и JEI: исправить SYNC_BOTH на NONE без замены create-client.toml целиком",
              "target": "config/create-client.toml",
              "oldText": 'syncRecipeViewerSearch = "SYNC_BOTH"',
              "newText": 'syncRecipeViewerSearch = "NONE"',
              "expectedOccurrences": 1,
              "alreadyAppliedText": 'syncRecipeViewerSearch = "NONE"'
          }

          # Simulate the exact editor semantics on the owner's current config shape:
          sample = '''\t[client.recipeViewerIntegration]\n\t\tsyncRecipeViewerSearch = "SYNC_BOTH"\n'''
          old = a["oldText"]; new = a["newText"]; marker = a["alreadyAppliedText"]
          assert sample.count(old) == a["expectedOccurrences"]
          changed = sample.replace(old, new)
          assert changed.count(marker) == 1
          assert changed.count(old) == 0
          # Idempotency via alreadyAppliedText.
          assert changed.count(old) == 0 and changed.count(marker) == a["expectedOccurrences"]

          print("STATIC VALIDATION PASS")
          print("actions:", len(data["actions"]))
          print("fromVersions:", data["fromVersions"])
          PY

      - name: Build ZIP
        run: |
          set -euo pipefail
          cd work
          zip -qr ../SGP_ClientPatch_1.6.1.zip .
          cd ..
          sha256sum SGP_ClientPatch_1.6.1.zip | tee SGP_ClientPatch_1.6.1.zip.sha256
          unzip -t SGP_ClientPatch_1.6.1.zip
          unzip -p SGP_ClientPatch_1.6.1.zip patch.json | python -m json.tool >/dev/null

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGP_ClientPatch_1.6.1_candidate
          path: |
            SGP_ClientPatch_1.6.1.zip
            SGP_ClientPatch_1.6.1.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Create Draft release and verify exact asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum SGP_ClientPatch_1.6.1.zip | awk '{print $1}')"
          cat > RELEASE_NOTES.md <<EOF
          ## SGP Client 1.6.1

          Hotfix для Minecraft 1.21.1 / NeoForge 21.1.249.

          ### Исправлено
          - Отключена синхронизация строк поиска JEI и Create Stock Keeper.
          - `config/create-client.toml`: `syncRecipeViewerSearch = "NONE"`.
          - Исправление применяется точечно через manifest; пользовательский `create-client.toml` целиком не заменяется.

          ### Совместимость
          Cumulative update поддерживает SGP Client:
          `1.0.0–1.5.3` и `1.6.0`.

          Неофициальный test `1.5.4` намеренно не поддерживается.

          Minecraft: **1.21.1**  
          NeoForge: **21.1.249**  
          Java: **21**

          ### SHA-256
          `$SHA`
          EOF

          gh release create v1.6.1 SGP_ClientPatch_1.6.1.zip             --repo "$GITHUB_REPOSITORY"             --title "SGP Client 1.6.1"             --notes-file RELEASE_NOTES.md             --draft             --target main

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.6.1" > release.json
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path("release.json").read_text())
          assert r["draft"] is True
          assert r["prerelease"] is False
          assets=r["assets"]
          assert len(assets)==1, assets
          a=assets[0]
          assert a["name"]=="SGP_ClientPatch_1.6.1.zip", a
          assert a["state"]=="uploaded", a
          assert a["size"]==pathlib.Path("SGP_ClientPatch_1.6.1.zip").stat().st_size
          print("DRAFT ASSET VERIFY PASS", a.get("digest"))
          PY

          mkdir verify-draft
          gh release download v1.6.1 --repo "$GITHUB_REPOSITORY"             --pattern "SGP_ClientPatch_1.6.1.zip" --dir verify-draft
          echo "$SHA  verify-draft/SGP_ClientPatch_1.6.1.zip" | sha256sum -c -
          unzip -t verify-draft/SGP_ClientPatch_1.6.1.zip

      - name: Publish stable and live-public smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum SGP_ClientPatch_1.6.1.zip | awk '{print $1}')"

          gh release edit v1.6.1 --repo "$GITHUB_REPOSITORY" --draft=false

          rollback_to_draft() {
            gh release edit v1.6.1 --repo "$GITHUB_REPOSITORY" --draft=true || true
          }
          trap rollback_to_draft ERR

          for i in 1 2 3 4 5 6; do
            if curl -fL --retry 2 --retry-delay 2               -o live.zip               "https://github.com/$GITHUB_REPOSITORY/releases/download/v1.6.1/SGP_ClientPatch_1.6.1.zip"; then
              break
            fi
            sleep 5
          done

          test -f live.zip
          echo "$SHA  live.zip" | sha256sum -c -
          unzip -t live.zip
          unzip -p live.zip patch.json > live-patch.json
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path("live-patch.json").read_text())
          assert d["patchId"]=="sgp-client-1.6.1"
          assert d["toVersion"]=="1.6.1"
          assert "1.6.0" in d["fromVersions"]
          a=next(x for x in d["actions"] if x["actionId"]=="decouple-create-stockkeeper-jei-search")
          assert a["type"]=="textReplaceExact"
          assert a["oldText"]=='syncRecipeViewerSearch = "SYNC_BOTH"'
          assert a["newText"]=='syncRecipeViewerSearch = "NONE"'
          print("LIVE PUBLIC SMOKE PASS")
          PY

          trap - ERR
