name: Repair SGP Client 1.8.0-test.1 notes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-client-1.8.0-test.1-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v1.8.0-test.1

    steps:
      - uses: actions/checkout@v4

      - name: Repair release notes without touching asset
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## SGP Client 1.8.0-test.1

          TEST: Create × Chipped Mechanical Saw automation.

          - Adds `SGP_Create_Chipped_Cutting_MC1.21.1.zip` through Paxi.
          - Generated from exact Chipped **4.0.2 NeoForge / Minecraft 1.21.1** workbench recipes and item tags.
          - Current coverage: **6968** `create:cutting` recipes across **277** Chipped workbench families.
          - Any member of a Chipped family can be cut into one exact Chipped variant; use the Mechanical Saw filter to select the desired output for automation.
          - Uses Minecraft 1.21.1 / NeoForge syntax: singular `recipe/`, `neoforge:conditions`, `processing_time`, result `id`.
          - Overlapping Chipped workbench tags are preserved as separate family→variant routes instead of dropping one conversion path.
          - No worldgen or ticking logic. Expected overhead is limited to datapack reload/startup and JEI recipe indexing.
          - Cumulative from every accepted stable **1.0.0–1.7.1**; forward-repair support for retained historical `1.7.0-test.1…test.16` is preserved.

          Chipped JAR SHA-256: `18ac6fd6b30db4922ccc6ee8bea5b113f69587505b7529834f37ace506427291`  
          Datapack SHA-256: `5ccabcd443793b581adfe14ecd6c7514becfaf866e74581e30305389d3e63ee8`  
          Datapack size: `2872134` bytes  
          Client patch SHA-256: `440fff574bb67eb91ed252ad38eb1811b29332499f70397dfea1c173502686e6`

          Minecraft 1.21.1 · NeoForge 21.1.249 · Java 21
          EOF
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md

          REL="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(printf '%s' "$REL" | jq -r '.draft')" = "false"
          test "$(printf '%s' "$REL" | jq -r '.prerelease')" = "true"
          test "$(printf '%s' "$REL" | jq -r '.body')" = "$(cat notes.md)"
          ASSETS="$(printf '%s' "$REL" | jq -c '.assets')"
          test "$(printf '%s' "$ASSETS" | jq 'length')" = "1"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].name')" = "SGP_ClientPatch_1.8.0-test.1.zip"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].digest')" = "sha256:440fff574bb67eb91ed252ad38eb1811b29332499f70397dfea1c173502686e6"
          test "$(printf '%s' "$ASSETS" | jq -r '.[0].size')" = "21363740"
          echo "RELEASE_NOTES_REPAIR_PASS"
